name: Backend - Deploy to Lightsail

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'backend-barber/**'

jobs:
  test:
    runs-on: ubuntu-22.04

    defaults:
      run:
        working-directory: backend-barber

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend-barber/package-lock.json

      - run: npm ci

      - name: Create .env
        run: |
          echo '${{ secrets.ENV_FILE }}' > .env

      - run: npm run test:ci

  deploy:
    needs: test
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: backend-barber
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend-barber/package-lock.json

      - run: npm ci
      - run: npm run build

      - name: Deploy to Lightsail via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: 'backend-barber/dist/*,backend-barber/package.json,backend-barber/package-lock.json,backend-barber/ecosystem.config.js'
          target: '/home/${{ secrets.SERVER_USER }}/app'
          strip_components: 1
          overwrite: true

      - name: Install deps and restart
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            set -e
            cd ~/app

            mkdir -p logs

            echo "Instalando dependencias..."
            npm ci --omit=dev

            echo "Escribiendo .env..."
            echo '${{ secrets.ENV_FILE }}' > .env

            echo "Reiniciando con PM2..."
            pm2 reload ecosystem.config.js 2>/dev/null || pm2 start ecosystem.config.js
            pm2 save
