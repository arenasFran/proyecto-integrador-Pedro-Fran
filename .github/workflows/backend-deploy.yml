name: Backend - Deploy to EC2

on:
  push:
    branches: [main]
    paths:
      - 'backend-barber/**'

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --replSet rs0
          --bind_ip_all
          --health-cmd="mongosh --eval 'db.runCommand({ ping: 1 })'"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    defaults:
      run:
        working-directory: backend-barber

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend-barber/package-lock.json

      - run: npm ci

      - name: Create .env
        run: |
          echo '${{ secrets.ENV_FILE }}' > .env

      - name: Initialize MongoDB replica set
        run: |
          container_id=$(docker ps --filter "ancestor=mongo:7" --format "{{.ID}}" | head -n 1)
          docker exec "$container_id" mongosh --quiet --eval \
            "try { rs.initiate({_id: 'rs0', members: [{_id: 0, host: '127.0.0.1:27017'}]}) } catch (error) { print(error) }"

          for attempt in {1..30}; do
            state=$(docker exec "$container_id" mongosh --quiet --eval "try { rs.status().myState } catch (error) { -1 }" | tail -n 1)
            if [ "$state" = "1" ]; then
              exit 0
            fi
            sleep 1
          done

          echo "MongoDB replica set did not become primary" >&2
          exit 1

      - run: npm run test:ci
        env:
          MONGO_TEST_URI: mongodb://127.0.0.1:27017/backend-barber-test?replicaSet=rs0

  deploy:
    needs: test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend-barber
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend-barber/package-lock.json

      - run: npm ci
      - run: npm run build

      - name: Deploy to EC2 via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: 'backend-barber/dist/*,backend-barber/package.json,backend-barber/package-lock.json,backend-barber/ecosystem.config.js'
          target: '/home/${{ secrets.EC2_USER }}/app'
          strip_components: 1
          overwrite: true

      - name: Install deps and restart
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            cd ~/app

            mkdir -p logs

            echo "Instalando dependencias..."
            npm ci --omit=dev

            echo "Escribiendo .env..."
            echo '${{ secrets.ENV_FILE }}' > .env

            echo "Reiniciando con PM2..."
            pm2 reload ecosystem.config.js 2>/dev/null || pm2 start ecosystem.config.js
            pm2 save
