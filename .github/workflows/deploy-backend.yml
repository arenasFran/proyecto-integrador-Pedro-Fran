name: Deploy backend

on:
  push:
    branches: [chore/preparar-produccion]
    paths: ['backend-barber/**']

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            set -e
            cd ~/app
            git pull --ff-only origin chore/preparar-produccion
            cd backend-barber
            npm ci
            npm run build
            pm2 restart barberia